[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-ai"
version = "0.1.0"
description = "Predictive maintenance on synthetic multivariate sensor time series: RUL, failure risk, anomaly detection, unit-level evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aymen Al Erwi" }]
dependencies = ["pandas>=2.0", "numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.8", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
predmaint = "predmaint.cli:main"

[tool.setuptools.packages.find]
include = ["predmaint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
